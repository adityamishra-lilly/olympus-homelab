apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linkding
  namespace: linkding
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ld.am-labs.dev
      secretName: ld-tls-secret
  rules:
    - host: ld.am-labs.dev
      http:
        paths:
          - backend:
              service:
                name: linkding
                port:
                  number: 9090
            path: /
            pathType: Prefix
