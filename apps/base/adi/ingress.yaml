apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adi
spec:
  ingressClassName: traefik
  rules:
    - host: am-labs.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adi
                port:
                  name: http
    - host: www.am-labs.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adi
                port:
                  name: http
